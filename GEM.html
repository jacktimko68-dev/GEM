<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, initial-scale=1, viewport-fit=cover">
<title>GEM Drill</title>
<style>
  :root{
    --ink:#FFFFFF;        /* primary text — full luminance, waveguides eat anything dimmer */
    --dim:#8C93A1;        /* secondary only; never used for anything you must read */
    --hit:#6FE3B0;        /* correct */
    --miss:#FFB35C;       /* incorrect — amber, not red: red is the dimmest hue on this panel */
    --cursor:#7FD4FF;     /* current selection */
    --rule:#2A2F38;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{
    background:#000;      /* black = transparent on the lens */
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  #stage{
    width:600px;height:600px;
    background:#000;
    color:var(--ink);
    font-family:"Inter","SF Pro Text",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    padding:22px 26px;
    transform-origin:center;
  }

  /* ---- status strip ---- */
  #strip{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:14px;border-bottom:1px solid var(--rule);
    font-size:17px;font-weight:600;letter-spacing:.02em;
  }
  #pips{display:flex;gap:7px}
  .pip{width:9px;height:9px;border-radius:50%;background:var(--rule)}
  .pip.done{background:var(--ink)}
  .pip.here{background:var(--cursor)}
  #tally{color:var(--dim);font-weight:500}

  /* ---- main ---- */
  #body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0}

  #sentence{
    font-size:25px;line-height:1.34;font-weight:500;
    letter-spacing:-.005em;
  }
  #sentence b{
    font-weight:800;
    color:var(--miss);
    /* the mark: heavier + hotter, so it reads instantly at a glance */
  }
  #sentence i{
    font-style:normal;font-weight:800;color:var(--hit);
  }

  #note{
    margin-top:20px;padding-top:16px;border-top:1px solid var(--rule);
    font-size:19px;line-height:1.42;font-weight:500;color:var(--ink);
  }
  #verdict{font-weight:800;font-size:21px;margin-bottom:8px}
  #verdict.hit{color:var(--hit)}
  #verdict.miss{color:var(--miss)}

  /* ---- options ---- */
  #options{margin-top:auto;padding-top:14px}
  .opt{
    display:flex;align-items:baseline;gap:11px;
    font-size:21px;line-height:1.2;font-weight:500;
    padding:8px 0;color:var(--dim);
  }
  .opt .caret{width:14px;flex:0 0 14px;font-weight:800;color:transparent}
  .opt.on{color:var(--ink);font-weight:700}
  .opt.on .caret{color:var(--cursor)}

  /* ---- prompts ---- */
  #hint{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);
    font-size:16px;font-weight:600;color:var(--dim);
  }

  /* ---- card screens ---- */
  .card{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .card h1{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
  .card p{font-size:20px;line-height:1.4;font-weight:500;color:var(--ink)}
  .card .sub{color:var(--dim);font-size:18px}
  .score{font-size:64px;font-weight:800;letter-spacing:-.03em}

  @media (prefers-reduced-motion:no-preference){
    #body,#options{transition:opacity .12s linear}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="strip">
    <div id="round">Round 1</div>
    <div id="pips"></div>
    <div id="tally">0/15</div>
  </div>
  <div id="body"></div>
</div>

<script>
/* ============================================================
   INPUT LAYER — rewire here only.

   The Web Apps path is still developer preview, so the exact
   Neural Band event names may change. Everything below funnels
   into act('up'|'down'|'select'), so when the API shifts you
   edit this block and nothing else.

   Neural Band mapping requested:
     thumb swipe up / down  -> move highlight
     pinch (tap)            -> select answer, then advance
   ============================================================ */

const BIND = {
  keys: {                       // desktop preview + most gesture bridges
    ArrowUp:'up', ArrowDown:'down',
    ArrowLeft:'up', ArrowRight:'down',
    Enter:'select', ' ':'select', Escape:'select'
  },
  gestureEvents: [              // listened for on window; add names as they land
    'metagesture', 'neuralband', 'wearablegesture'
  ],
  gestureMap: {                 // event.detail.gesture -> action
    swipe_up:'up', swipeup:'up', up:'up',
    swipe_down:'down', swipedown:'down', down:'down',
    pinch:'select', tap:'select', click:'select',
    double_tap:'select', doubletap:'select'
  }
};

function wireInput(){
  window.addEventListener('keydown', e=>{
    const a = BIND.keys[e.key];
    if(a){ e.preventDefault(); act(a); }
  });

  // frame tap / screen tap
  window.addEventListener('click', ()=>act('select'));

  // touch swipe fallback for phone preview
  let y0=null;
  window.addEventListener('touchstart', e=>{ y0=e.touches[0].clientY; },{passive:true});
  window.addEventListener('touchend', e=>{
    if(y0===null) return;
    const dy = e.changedTouches[0].clientY - y0;
    if(Math.abs(dy)>34){ act(dy<0?'down':'up'); }
    y0=null;
  },{passive:true});

  // neural band
  BIND.gestureEvents.forEach(name=>{
    window.addEventListener(name, e=>{
      const raw = (e.detail && (e.detail.gesture||e.detail.type||e.detail.name)) || '';
      const a = BIND.gestureMap[String(raw).toLowerCase()];
      if(a) act(a);
    });
  });
}

/* ============================================================
   CONTENT
   marked: same sentence, with the diagnostic bolded.
     <b>…</b>  the problem
     <i>…</i>  what fixes or contrasts with it
   ============================================================ */

const STRUCT = ['Comma splice','Faulty/vague pronoun reference','Sentence fragment','Fused sentence'];
const CLARITY = ['Fillers','Use of passive voice','Lack of parallel structure','Redundancies','Dangling/misplaced modifiers'];

const ROUNDS = [
{
  name:'Round 1', tag:'Structure',
  qs:[
  { text:"When the discussion ran past six o'clock, the committee adjourned early no vote was recorded.",
    marked:"When the discussion ran past six o'clock, the committee adjourned <b>early no vote</b> was recorded.",
    options:STRUCT, answer:'Fused sentence',
    note:"Two complete sentences collide with nothing between them. The seam is right there — <b>early</b> ends one, <b>no vote</b> starts the next." },

  { text:"Even though email is convenient and many employees still prefer face-to-face meetings.",
    marked:"<b>Even though</b> email is convenient <b>and</b> many employees still prefer face-to-face meetings.",
    options:STRUCT, answer:'Sentence fragment',
    note:"<b>Even though</b> traps everything after it, and <b>and</b> pulls the second clause in too. No comma ever releases it, so nothing stands alone." },

  { text:"The supervisor reviewed the file with the trainee, but she had already noticed the discrepancy.",
    marked:"The supervisor reviewed the file with the trainee<i>, but</i> <b>she</b> had already noticed the discrepancy.",
    options:STRUCT, answer:'Faulty/vague pronoun reference',
    note:"<i>Comma + but</i> is a legal join, so structure is clean. <b>She</b> could be either woman." },

  { text:"Formal reports require extensive research, informal memos require far less preparation.",
    marked:"Formal reports require extensive research<b>,</b> informal memos require far less preparation.",
    options:STRUCT, answer:'Comma splice',
    note:"Both halves stand alone. A bare <b>comma</b> can't hold them together." },

  { text:"Because the deadline was moved up, the team requested additional resources, the manager approved the budget.",
    marked:"<i>Because the deadline was moved up,</i> the team requested additional resources<b>,</b> the manager approved the budget.",
    options:STRUCT, answer:'Comma splice',
    note:"Delete through the first comma. What's left is two standalone clauses joined by a <b>comma</b>. The opening <i>Because</i> was never the problem." }
]},
{
  name:'Round 2', tag:'Clarity',
  qs:[
  { text:"There are four analysts who cover the energy sector for the firm.",
    marked:"<b>There are</b> four analysts <b>who</b> cover the energy sector for the firm.",
    options:CLARITY, answer:'Fillers',
    note:"<b>There are</b> buries the real subject. <i>Four analysts cover the energy sector.</i>" },

  { text:"The budget proposal was approved by the regional director last quarter.",
    marked:"The budget proposal <b>was approved by</b> the regional director last quarter.",
    options:CLARITY, answer:'Use of passive voice',
    note:"<b>was ___ed by</b> demotes the doer. <i>The regional director approved the budget proposal.</i>" },

  { text:"Her responsibilities include answering phones, filing documents, and she greets visitors.",
    marked:"Her responsibilities include <i>answering</i> phones, <i>filing</i> documents, and <b>she greets</b> visitors.",
    options:CLARITY, answer:'Lack of parallel structure',
    note:"Two <i>-ing</i> items, then a clause with its own subject. <b>She greets</b> breaks the run." },

  { text:"The end result was an unexpected surprise to each and every member of the team.",
    marked:"The <b>end result</b> was an <b>unexpected surprise</b> to <b>each and every</b> member of the team.",
    options:CLARITY, answer:'Redundancies',
    note:"Three doubled pairs. Results are already ends, surprises are already unexpected, every is already each." },

  { text:"Arriving late to the meeting, the proposal was already under discussion.",
    marked:"<b>Arriving late to the meeting,</b> <b>the proposal</b> was already under discussion.",
    options:CLARITY, answer:'Dangling/misplaced modifiers',
    note:"The proposal didn't arrive. Whoever did is missing from the sentence entirely — that absence is what makes it dangling." }
]},
{
  name:'Round 3', tag:'Mixed',
  qs:[
  { text:"Although the sample size was small, the survey results were inconclusive, the committee requested a second round.",
    marked:"<i>Although the sample size was small,</i> the survey results were inconclusive<b>,</b> the committee requested a second round.",
    options:STRUCT, answer:'Comma splice',
    note:"Delete through the first comma, then count. Two standalone clauses, one <b>comma</b>." },

  { text:"The department reorganized its filing system and retrained the staff; that took most of the quarter.",
    marked:"The department reorganized its filing system and retrained the staff<i>;</i> <b>that</b> took most of the quarter.",
    options:STRUCT, answer:'Faulty/vague pronoun reference',
    note:"The <i>semicolon</i> is correct. <b>That</b> points at the whole first clause instead of a noun." },

  { text:"The assistant handed the documents to the client in a torn folder.",
    marked:"The assistant handed the documents to <i>the client</i> <b>in a torn folder</b>.",
    options:CLARITY, answer:'Dangling/misplaced modifiers',
    note:"<b>In a torn folder</b> describes the documents, but it's parked next to <i>the client</i>. Misplaced, not dangling — the right noun is present, just in the wrong seat." },

  { text:"Unless the vendor confirms delivery by Thursday and the warehouse clears the backlog.",
    marked:"<b>Unless</b> the vendor confirms delivery by Thursday <b>and</b> the warehouse clears the backlog.",
    options:STRUCT, answer:'Sentence fragment',
    note:"Two subject-verb pairs, both sealed inside <b>Unless</b>. No comma, so nothing escapes." },

  { text:"It is important to review the past history of the account before presenting the true facts.",
    marked:"<i>It is</i> important to review the <b>past history</b> of the account before presenting the <b>true facts</b>.",
    options:CLARITY, answer:'Redundancies',
    note:"<i>It is</i> is a filler too, but the doubled wording appears twice. When more than one guide fits, count instances." }
]}];

/* ============================================================
   STATE
   ============================================================ */

const S = { r:0, q:0, sel:0, phase:'intro', correct:0, roundCorrect:0, answered:null };
const body = document.getElementById('body');

function cur(){ return ROUNDS[S.r].qs[S.q]; }

function act(a){
  if(S.phase==='question'){
    const n = cur().options.length;
    if(a==='up')   { S.sel = (S.sel-1+n)%n; return render(); }
    if(a==='down') { S.sel = (S.sel+1)%n;   return render(); }
    if(a==='select'){
      S.answered = cur().options[S.sel];
      const right = S.answered === cur().answer;
      if(right){ S.correct++; S.roundCorrect++; }
      S.phase='feedback';
      return render();
    }
  }
  if(a!=='select') return;

  if(S.phase==='intro'){ S.phase='question'; return render(); }

  if(S.phase==='feedback'){
    S.q++;
    if(S.q >= ROUNDS[S.r].qs.length){ S.phase='roundEnd'; }
    else { S.sel=0; S.phase='question'; }
    return render();
  }

  if(S.phase==='roundEnd'){
    S.r++;
    if(S.r >= ROUNDS.length){ S.phase='done'; }
    else { S.q=0; S.sel=0; S.roundCorrect=0; S.phase='question'; }
    return render();
  }

  if(S.phase==='done'){
    S.r=0; S.q=0; S.sel=0; S.correct=0; S.roundCorrect=0; S.phase='question';
    return render();
  }
}

/* ============================================================
   RENDER
   ============================================================ */

function strip(){
  const done = S.phase==='done' || S.phase==='intro';
  document.getElementById('round').textContent =
    done ? 'GEM Drill' : ROUNDS[S.r].name + ' · ' + ROUNDS[S.r].tag;

  const pips = document.getElementById('pips');
  pips.innerHTML='';
  if(!done){
    ROUNDS[S.r].qs.forEach((_,i)=>{
      const d=document.createElement('div');
      d.className = 'pip' + (i<S.q?' done' : i===S.q?' here':'');
      pips.appendChild(d);
    });
  }
  const total = ROUNDS.reduce((n,r)=>n+r.qs.length,0);
  document.getElementById('tally').textContent = S.correct + '/' + total;
}

function render(){
  strip();
  const q = (S.phase==='question'||S.phase==='feedback') ? cur() : null;

  if(S.phase==='intro'){
    body.innerHTML = `
      <div class="card">
        <h1>GEM Drill</h1>
        <p>Fifteen sentences. Name the error.</p>
        <p class="sub">Swipe up or down to move. Pinch to answer.</p>
        <div id="hint">Pinch to start</div>
      </div>`;
    return;
  }

  if(S.phase==='question'){
    body.innerHTML = `
      <div id="sentence">${q.text}</div>
      <div id="options">
        ${q.options.map((o,i)=>`
          <div class="opt${i===S.sel?' on':''}">
            <span class="caret">&#9656;</span><span>${o}</span>
          </div>`).join('')}
      </div>`;
    return;
  }

  if(S.phase==='feedback'){
    const right = S.answered === q.answer;
    body.innerHTML = `
      <div id="sentence">${q.marked}</div>
      <div id="note">
        <div id="verdict" class="${right?'hit':'miss'}">
          ${right ? q.answer : 'Not quite &mdash; ' + q.answer}
        </div>
        ${q.note}
      </div>
      <div id="hint">Pinch to continue</div>`;
    return;
  }

  if(S.phase==='roundEnd'){
    const n = ROUNDS[S.r].qs.length;
    body.innerHTML = `
      <div class="card">
        <div class="score">${S.roundCorrect}/${n}</div>
        <h1>${ROUNDS[S.r].name} done</h1>
        <p class="sub">${ROUNDS[S.r+1] ? 'Next: ' + ROUNDS[S.r+1].tag : 'Last round cleared'}</p>
        <div id="hint">Pinch to continue</div>
      </div>`;
    return;
  }

  if(S.phase==='done'){
    const total = ROUNDS.reduce((n,r)=>n+r.qs.length,0);
    body.innerHTML = `
      <div class="card">
        <div class="score">${S.correct}/${total}</div>
        <h1>Drill complete</h1>
        <p class="sub">Pinch to run it again</p>
      </div>`;
  }
}

/* fit the 600×600 stage into whatever viewport is previewing it */
function fit(){
  const s = Math.min(window.innerWidth/600, window.innerHeight/600, 1);
  document.getElementById('stage').style.transform = 'scale('+s+')';
}
window.addEventListener('resize', fit);

wireInput();
fit();
render();
</script>
</body>
</html>
